name: citizen_app
description: "CivicPulse Citizen Mobile App for community issue reporting and tracking"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  intl: ^0.20.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking & Auth
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Offline Storage & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Maps & Location
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.5
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Media & Sensors
  image_picker: ^1.1.2
  record: ^5.2.0
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1

  # Connectivity & Push Notifications
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Utilities
  uuid: ^4.5.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
